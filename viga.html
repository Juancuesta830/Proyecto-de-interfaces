<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calcular viga de hormigón</title>

    <link rel="stylesheet" href="style-viga.css">

</head>


<body>

    <main class="contenedor">

        <!-- VOLVER AL MENÚ -->

        <a href="menu.html" class="volver">
            ← Volver al menú
        </a>


        <!-- TÍTULO -->

        <section class="encabezado">

            <h1>
                Calcular viga de hormigón
            </h1>

            <p>
                Ingresa el largo de la viga para calcular los materiales necesarios.
            </p>

        </section>


        <!-- FORMULARIO -->

        <section class="tarjeta formulario">


            <!-- LARGO -->

            <div class="campo campo-completo">

                <label for="largo">
                    Largo de la viga (m)
                </label>

                <input
                    type="number"
                    id="largo"
                    placeholder="Ej: 5"
                    min="0"
                    step="0.01"
                >

            </div>


            <!-- BOTONES -->

            <div class="botones">

                <button
                    type="button"
                    class="btn btn-principal"
                    onclick="calcularViga()"
                >
                    🧮 CALCULAR MATERIALES
                </button>


                <a
                    href="menu.html"
                    class="btn btn-secundario"
                >
                    ← VOLVER AL MENÚ
                </a>

            </div>

        </section>

    </main>


    <script src="viga.js"></script>

</body>

</html>
