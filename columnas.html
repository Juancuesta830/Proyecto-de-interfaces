<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular columnas de hormigón</title>
    <link rel="stylesheet" href="style-columnas.css">
</head>
<body>
    <main class="contenedor">
        <a href="menu.html" class="volver">← Volver al menú</a>

        <section class="encabezado">
            <h1>Calcular columnas de hormigón</h1>
            <p>Ingresa el largo de la columna para calcular los materiales.</p>
        </section>

        <section class="tarjeta formulario">
            <div class="campo campo-completo">
                <label for="largoColumna">Largo de la columna (m)</label>
                <input type="number" id="largoColumna" placeholder="Ej: 3" min="0" step="0.01">
            </div>

            <div class="botones">
                <a href="resultado-columnas.html" class="btn btn-principal">
                    🧮 CALCULAR MATERIALES
                </a>
                <a href="menu.html" class="btn btn-secundario">← VOLVER AL MENÚ</a>
            </div>
        </section>
    </main>


</body>
</html>
