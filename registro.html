<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta</title>

  <link rel="shortcut icon" href="Materiales PRO.png" type="image/png">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="contenedor">
    <header class="encabezado">
      <img class="logo" src="Materiales PRO.png" alt="Logo Materiales Pro">

      <h1>Crear cuenta</h1>
      <p>Completa los datos para registrarte en el sistema</p>
    </header>

    <form id="form-registro" action="Login.html" method="post">
      <label for="nombre">Nombre completo</label>
      <input
        type="text"
        id="nombre"
        name="nombre"
        placeholder="Ingresa tu nombre"
        required
      >

      <label for="usuario">Usuario</label>
      <input
        type="text"
        id="usuario"
        name="usuario"
        placeholder="Elige un nombre de usuario"
        required
      >

      <label for="contrasena">Contraseña</label>
      <input
        type="password"
        id="contrasena"
        name="contrasena"
        placeholder="Mínimo 6 caracteres"
        minlength="6"
        required
      >

      <label for="confirmar-contrasena">Confirmar contraseña</label>
      <input
        type="password"
        id="confirmar-contrasena"
        name="confirmar-contrasena"
        placeholder="Repite tu contraseña"
        minlength="6"
        required
      >

      <button type="submit">CREAR CUENTA</button>

      <p class="registro">
        ¿Ya tienes una cuenta?
        <a href="Login.html">Iniciar sesión</a>
      </p>
    </form>
  </main>
  <script src="script.js"></script>
</body>
</html>
