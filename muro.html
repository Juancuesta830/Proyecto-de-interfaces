<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calcular muro de ladrillo</title>

    <link rel="stylesheet" href="style-muro.css">
</head>

<body>

    <main class="contenedor">

        <!-- VOLVER AL MENÚ -->
        <a href="menu.html" class="volver">
            ← Volver al menú
        </a>


        <!-- TÍTULO -->
        <section class="encabezado">

            <h1>
                Calcular muro de ladrillo
            </h1>

            <p>
                Ingresa las dimensiones del muro y selecciona su espesor.
            </p>

        </section>


        <!-- FORMULARIO -->
        <section class="tarjeta formulario">


            <!-- ESPESOR -->

            <div class="campo campo-completo">

                <label for="espesor">
                    Espesor del muro
                </label>

                <select id="espesor">

                    <option value="20">
                        20 cm
                    </option>

                    <option value="30">
                        30 cm
                    </option>

                </select>

            </div>


            <!-- LARGO Y ALTO -->

            <div class="fila">

                <div class="campo">

                    <label for="largo">
                        Largo del muro
                    </label>

                    <input
                        type="number"
                        id="largo"
                        placeholder="Largo (m)"
                        min="0"
                        step="0.01"
                    >

                </div>


                <div class="campo">

                    <label for="alto">
                        Alto del muro
                    </label>

                    <input
                        type="number"
                        id="alto"
                        placeholder="Alto (m)"
                        min="0"
                        step="0.01"
                    >

                </div>

            </div>


            <!-- BOTONES -->

            <div class="botones">

                <button
                    type="button"
                    class="btn btn-principal"
                    onclick="calcularMuro()"
                >
                    🧮 CALCULAR MATERIALES
                </button>


                <a
                    href="menu.html"
                    class="btn btn-secundario"
                >
                    ← VOLVER AL MENÚ
                </a>

            </div>

        </section>

    </main>


    <script src="muro.js"></script>

</body>

</html>
