<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Pintura</title>
    <link rel="stylesheet" href="style-columnas.css">
</head>
<body>
    <main class="contenedor">
        <a href="menu.html" class="volver">← Volver al menú</a>

        <section class="encabezado">
            <h1>Calcular Pintura</h1>
            <p>Ingresa la superficie del muro a pintar.</p>
        </section>

        <section class="tarjeta formulario">
            <div class="campo campo-completo">
                <label for="superficieMuro">Superficie del muro (m²)</label>
                <input type="number" id="superficieMuro" placeholder="Ej: 5" min="0" step="0.01">
            </div>

            <div class="botones">
                <button type="button" class="btn btn-principal" onclick="calcularPintura()">
                    🧮 CALCULAR MATERIALES
                </button>
                <a href="menu.html" class="btn btn-secundario">← VOLVER AL MENÚ</a>
            </div>
        </section>

        <!-- SECCIÓN DONDE SE MUESTRAN LOS RESULTADOS -->
        <section class="tarjeta resultado" id="resultado" style="display: none;">

        </section>
    </main>

</body>
</html>
