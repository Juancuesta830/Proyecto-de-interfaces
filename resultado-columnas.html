<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados del Cálculo</title>
    <link rel="stylesheet" href="style-columnas.css">
</head>
<body>
    <main class="contenedor">
        <!-- Banner de éxito igual al de la imagen -->
        <div class="alerta-exito">
            <span class="icono">✓</span>
            <div>
                <h3>Cálculo realizado correctamente</h3>
                <p>Los materiales han sido calculados satisfactoriamente.</p>
            </div>
        </div>

        <h1 class="titulo-pagina">Resultado del cálculo</h1>

        <section class="tarjeta datos">
            <h2>DATOS INGRESADOS</h2>
            <div class="dato-fila">
                <span>Tipo de cálculo</span>
                <strong id="resultadoTipo">--</strong>
            </div>
            <div class="dato-fila">
                <span>Dimensiones</span>
                <strong id="resultadoDimensiones">--</strong>
            </div>
        </section>

        <section class="tarjeta materiales">
            <h2>MATERIALES NECESARIOS</h2>
            <div class="tabla">
                <div class="tabla-header">
                    <span>Material</span>
                    <span>Cantidad</span>
                    <span>Unidad</span>
                </div>
                <div id="tablaMateriales">
                    <!-- Filas cargadas dinámicamente -->
                </div>
            </div>
        </section>

        <div class="botones">
            <a href="columnas.html" id="btnNuevoCalculo" class="btn btn-principal">+ NUEVO CÁLCULO</a>
            <a href="menu.html" class="btn btn-secundario">← VOLVER AL MENÚ</a>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Leer datos guardados
            const tipo = localStorage.getItem("tipoCalculo") || "Sin datos";
            const dim = localStorage.getItem("dimensiones") || "Sin datos";
            const origen = localStorage.getItem("origenCalculo") || "columnas.html";
            const matJSON = localStorage.getItem("materiales");

            // Mostrar tipo y dimensiones
            document.getElementById("resultadoTipo").textContent = tipo;
            document.getElementById("resultadoDimensiones").textContent = dim;

            // Configurar el enlace del botón "+ NUEVO CÁLCULO"
            document.getElementById("btnNuevoCalculo").setAttribute("href", origen);

            // Renderizar la tabla de materiales
            const tabla = document.getElementById("tablaMateriales");
            tabla.innerHTML = "";

            if (matJSON) {
                const materiales = JSON.parse(matJSON);
                materiales.forEach(item => {
                    const fila = document.createElement("div");
                    fila.className = "tabla-fila";
                    fila.innerHTML = `
                        <span>${item.nombre}</span>
                        <strong>${item.cantidad}</strong>
                        <span>${item.unidad}</span>
                    `;
                    tabla.appendChild(fila);
                });
            }
        });
    </script>
</body>
</html>
