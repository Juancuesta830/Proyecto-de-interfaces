<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcular Techo</title>
    <link rel="stylesheet" href="style-columnas.css">
</head>
<body>
    <main class="contenedor">
        <a href="menu.html" class="volver">← Volver al menú</a>

        <section class="encabezado">
            <h1>Calcular Techo</h1>
            <p>Ingresa las dimensiones de la superficie y el tipo de techo.</p>
        </section>

        <section class="tarjeta formulario">
            <div class="campo campo-completo">
                <label for="espesorTecho">Espesor (m)</label>
                <input type="number" id="espesorTecho" placeholder="Ej: 5" min="0" step="0.01">
            </div>

            <div class="campo campo-completo">
                <label for="anchoTecho">Ancho (m)</label>
                <input type="number" id="anchoTecho" placeholder="Ej: 5" min="0" step="0.01">
            </div>

            <div class="campo campo-completo">
                <label for="largoTecho">Largo (m)</label>
                <input type="number" id="largoTecho" placeholder="Ej: 10" min="0" step="0.01">
            </div>

            <div class="botones">
                <a href="resultado-techo.html" class="btn btn-principal">
                    🧮 CALCULAR MATERIALES
                </a>
                <a href="menu.html" class="btn btn-secundario">← VOLVER AL MENÚ</a>
            </div>
        </section>

        <!-- SECCIÓN DONDE SE MUESTRAN LOS RESULTADOS -->
        <section class="tarjeta resultado" id="resultado" style="display: none;">
            <!-- El contenido se genera dinámicamente con JavaScript -->
        </section>
    </main>

 
</body>
</html>
