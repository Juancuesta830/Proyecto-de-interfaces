<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado Pintura</title>
    <link rel="stylesheet" href="style-columnas.css">
</head>
<body>
    <main class="contenedor">
        <!-- Banner de éxito -->
        <div class="alerta-exito">
            <span class="icono">✓</span>
            <div>
                <h3>Cálculo realizado correctamente</h3>
                <p>Los materiales han sido calculados satisfactoriamente.</p>
            </div>
        </div>

        <h1 class="titulo-pagina">Resultado del cálculo</h1>

        <section class="tarjeta datos">
            <h2>DATOS INGRESADOS</h2>
            <div class="dato-fila">
                <span>Tipo de cálculo</span>
                <strong id="resultadoTipo">--</strong>
            </div>
            <div class="dato-fila">
                <span>Superficie</span>
                <strong id="resultadoDimensiones">--</strong>
            </div>
        </section>

        <section class="tarjeta materiales">
            <h2>MATERIALES NECESARIOS</h2>
            <div class="tabla">
                <div class="tabla-header">
                    <span>Detalle</span>
                    <span>Cantidad</span>
                    <span>Unidad</span>
                </div>
                <div id="tablaMateriales">
                    <!-- Filas cargadas dinámicamente -->
                </div>
            </div>
        </section>

        <div class="botones">
            <a href="pintura.html" id="btnNuevoCalculo" class="btn btn-principal">+ NUEVO CÁLCULO</a>
            <a href="menu.html" class="btn btn-secundario">← VOLVER AL MENÚ</a>
        </div>
    </main>

    
</body>
</html>
